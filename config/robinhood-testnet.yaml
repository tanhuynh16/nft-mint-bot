# Robinhood Chain testnet — rehearse everything here before touching mainnet.
network:
  name: robinhood-testnet
  chainId: 46630
  orderingModel: fcfs
  feeModel: orbit
  blockExplorerUrl: https://explorer.testnet.chain.robinhood.com

rpc:
  endpoints:
    - ${TESTNET_RPC_PRIMARY}
  submitEndpoint: ${TESTNET_SEQUENCER_URL}
  parallelBroadcast: false
  timeoutMs: 10000

mint:
  # No testnet twin exists for hood-penguins — its contract is not deployed on 46630
  # (eth_getCode returns 0x). Replace with a slug that does exist on testnet to
  # rehearse against; as-is the drop-chain guard will stop the run with a clear error.
  collectionSlug: replace-me
  quantity: 1
  maxRetries: 20
  retryDelayMs: 100
  waitForStage: true

gas:
  # Orbit L2 base fee sits around 0.01 gwei. This ceiling is ~1000x headroom and still
  # cheap; it exists to cap a runaway estimate, not to bid for position.
  strategy: normal
  maxGasGwei: 10
  gasLimitBuffer: 1.3

execution:
  mode: preflight
  waitForConfirmation: true
  confirmationBlocks: 1

wallet:
  privateKeyEnv: PRIVATE_KEY
