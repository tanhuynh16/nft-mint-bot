# Ethereum mainnet — priority-fee auction.
#
# Unlike the Orbit configs, fee strategy genuinely affects inclusion order here, and
# broadcasting to several endpoints improves propagation. Pre-signing is NOT usable:
# the fee must be decided against the base fee at send time.
network:
  name: ethereum
  chainId: 1
  orderingModel: priority-auction
  feeModel: eip1559
  blockExplorerUrl: https://etherscan.io

rpc:
  endpoints:
    # Same vars as paymentEndpoints below, so one override covers both roles. RPC_PRIMARY
    # is not reused here: in a Robinhood-targeted .env it points at Robinhood's RPC, and
    # the chain-id check would (correctly) reject it on an Ethereum config.
    - ${ETHEREUM_RPC:-https://ethereum.reth.rs/rpc}
  parallelBroadcast: true
  timeoutMs: 10000

  # Networks available for cross-chain payment. Selecting mint.payment.chain switches
  # to the matching entry; set the env var to override the public default.
  paymentEndpoints:
    ethereum:  ["${ETHEREUM_RPC:-https://ethereum.reth.rs/rpc}"]
    base:      ["${BASE_RPC:-https://mainnet.base.org}"]
    arbitrum:  ["${ARBITRUM_RPC:-https://arb1.arbitrum.io/rpc}"]
    optimism:  ["${OPTIMISM_RPC:-https://mainnet.optimism.io}"]
    polygon:   ["${POLYGON_RPC:-https://polygon.drpc.org}"]

mint:
  # A live Ethereum drop, so this example actually runs. The previous slug was a
  # Robinhood collection, which the drop-chain guard rejects on an Ethereum config.
  collectionSlug: doomscrollx
  quantity: 1
  maxRetries: 20
  retryDelayMs: 100
  waitForStage: true

gas:
  strategy: aggressive
  priorityMultiplier: 1.5
  maxFeeMultiplier: 2.0
  maxGasGwei: 200
  gasLimitBuffer: 1.25

execution:
  mode: preflight
  waitForConfirmation: true
  confirmationBlocks: 1

wallet:
  privateKeyEnv: PRIVATE_KEY
